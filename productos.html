<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos los Productos - CAPAZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <img src="img/logo 2.png" alt="Logo" class="logo">
        <nav>
            <ul class="nav-menu">
                <li><a class="nav-link" href="index.html">Inicio</a></li>
                <li><a class="nav-link" href="productos.html">Productos</a></li>
                <li><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                <li><a class="nav-link" href="contactanos.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Buscar productos...">
            <button class="search-button">Buscar</button>
        </div>
    </header>

    <main class="main-content container my-5">
        <h1 class="section-title text-center mb-5">Nuestras Prendas</h1>
        
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 products-grid" id="productos-grid-todos">
            </div>
    </main>

    <div class="carrito-container p-4">
        <h2 class="text-center section-title mb-4">Carrito de Compras</h2>
        <div class="carrito-items" id="items-carrito">
            </div>
        <div class="carrito-total border-top pt-3 mt-3 fw-bold fs-5 d-flex justify-content-between">
            <span>Total:</span> $<span id="total-carrito">0.00</span>
        </div>
        <button id="proceder-pago" class="btn add-to-cart-btn mt-4 w-100">
            <i class="fab fa-whatsapp me-2"></i> Proceder con el pago
        </button>
    </div>

    <div id="toast-notification">
        <div id="toast-body"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
